name: Rotate a key

# The private key of each key directory lives online, as an
# organization secret, and a run of this workflow is the only thing
# that holds one. No human handles key material at any point.
#
# The workflow is a thin caller. FuguWeb holds the order of the steps
# in the reusable workflow keys-rotate.yml, and the fuguweb verbs
# hold every trust rule. This repository takes site content alone,
# per D-01.
#
# The site publishes two key directories. The releng directory holds
# the keys that sign the releases, and the admin directory holds the
# keys that reach the administrators. The caller derives each value
# that a directory decides from the directory input, so a run cannot
# pair one directory with the secrets of the other:
#
#   directory     releng                          admin
#   tree path     web/releng                      web/admin
#   environment   releng                          admin
#   org word      fugureleng                      fuguadmin
#   prefix        RELENG                          ADMIN
#   published at  https://www.fugubsd.org/releng  https://www.fugubsd.org/admin
#   visibility    Website,Fugu,FuguBench,FuguVM,FuguWeb     Website
#
# The org word leads every key name of its directory, for example
# fugureleng-1-release.pub. FuguWeb WEB-KEYS-2 refuses two key blocks
# that name one org word, so each directory takes a word of its own.
#
# The prefix names the two secrets and the variable of each purpose:
# <PREFIX>_<PURPOSE>_KEY_A, <PREFIX>_<PURPOSE>_KEY_B, and the
# variable <PREFIX>_<PURPOSE>_SLOT. The GitHub App of the environment
# takes the same prefix: <PREFIX>_APP_ID and <PREFIX>_APP_PRIVATE_KEY.
# The callee reads each of them through the JSON form of the secrets
# context, per FuguWeb WEB-ACTIONS-4.
#
# The visibility list gives each private key to the repositories
# that read it. A releng key reaches this site, and each repository
# that releases a Perl distribution. An admin key serves this site
# alone.
#
# A root step binds each subordinate key of its directory again, per
# FuguWeb WEB-TRUST-7. The subordinate purposes input names those
# keys, and an empty value binds none. A first root mint of an empty
# directory therefore names none, and a later root promote names each
# purpose that its directory holds.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "mint makes the next key; promote makes it current"
        required: true
        default: mint
        type: choice
        options:
          - mint
          - import
          - promote
      purpose:
        description: "The purpose word of the key, for example root"
        required: true
        # SITE-KEYS-4. The root is the current key of each directory,
        # and a step of another purpose fails while the directory
        # holds no root. The default therefore names the root, and
        # never a subordinate key. A first mint of a directory that
        # no keys block names also needs the bootstrap flag, per
        # FuguWeb WEB-ROTATE-22, and that flag defaults to false.
        default: root
        type: string
      type:
        description: "The key type of a mint or an import; a promote takes none"
        required: false
        default: ""
        type: string
      directory:
        description: "The key directory that the step writes"
        required: true
        default: releng
        type: choice
        options:
          - releng
          - admin
      bootstrap:
        description: "Make the keys block of a directory that no block names"
        required: false
        default: false
        type: boolean
      subordinate_purposes:
        description: "The subordinate purposes, separated by spaces"
        required: false
        default: ""
        type: string
      email:
        description: "The address of an OpenPGP mint"
        required: false
        default: ""
        type: string
      expires:
        description: "The expiry date of an OpenPGP mint"
        required: false
        default: ""
        type: string
      file:
        description: "The public key file of an import"
        required: false
        default: ""
        type: string

# FuguWeb WEB-ACTIONS-14. permissions, concurrency and secrets:
# inherit stay in the caller, because a called job widens none of
# them.
permissions:
  # The callee commits the key directory and the description to this
  # repository.
  contents: write
  # The callee starts the publish workflow of this repository, per
  # FuguWeb WEB-ACTIONS-8. A push that GITHUB_TOKEN makes raises no
  # workflow run, and workflow_dispatch is the one event that the
  # token can raise.
  actions: write

concurrency:
  # One key step of this site runs at a time, whatever the directory.
  # Each step commits the same description to the same branch, and
  # each one starts the same publish workflow.
  group: keys
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate
    # The commit of the v0.6.0 tag. The callee runs beside a private
    # key, so the reference is a commit and never a tag or a branch.
    uses: FuguBSD/FuguWeb/.github/workflows/keys-rotate.yml@1eda3b0708ee08c390fa75611e2f05ff4f9cfd2d
    secrets: inherit
    with:
      step: ${{ inputs.step }}
      purpose: ${{ inputs.purpose }}
      type: ${{ inputs.type }}
      bootstrap: ${{ inputs.bootstrap }}
      subordinate_purposes: ${{ inputs.subordinate_purposes }}
      email: ${{ inputs.email }}
      expires: ${{ inputs.expires }}
      file: ${{ inputs.file }}
      owner: FuguBSD
      publish_workflow: publish.yml
      # The directory decides each value below.
      directory: web/${{ inputs.directory }}
      environment: ${{ inputs.directory }}
      url: https://www.fugubsd.org/${{ inputs.directory }}
      org: ${{ inputs.directory == 'releng' && 'fugureleng' || 'fuguadmin' }}
      secret_prefix: ${{ inputs.directory == 'releng' && 'RELENG' || 'ADMIN' }}
      visibility:
        ${{ inputs.directory == 'releng' &&
        'Website,Fugu,FuguBench,FuguVM,FuguWeb' || 'Website' }}
