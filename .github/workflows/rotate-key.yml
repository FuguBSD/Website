name: Rotate a release key

# The release key of FuguBSD lives online, as an organization secret,
# and this workflow is the only thing that ever holds it. No human
# handles key material at any point.
#
# Two secrets hold the private keys, and one organization variable
# names the active slot:
#
#   SIGNIFY_RELEASE_KEY_A   secret     a signify private key
#   SIGNIFY_RELEASE_KEY_B   secret     the other slot
#   SIGNIFY_RELEASE_SLOT    variable   A or B
#
# The names are fixed and the variable moves. A workflow that named
# one fixed secret could not rotate without a human, and a workflow
# that renamed a secret would break every caller that reads it.
#
# Two steps make one rotation. A mint generates the next key, and the
# current key signs the manifest that names it. The step then opens a
# pull request against FuguBSD/Tooling that declares the new key. A
# promote makes that key current, after the Tooling change merges and
# after each consumer syncs it.
#
# The first mint of a purpose finds no current key. It makes the new
# key current at once, and the key signs its own manifest.
#
# The pull request is a requirement and not an option. It is the human
# review that stops a compromised current key from minting a successor
# that every consumer trusts.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "mint makes the next key; promote makes it current"
        required: true
        default: mint
        type: choice
        options:
          - mint
          - promote
      purpose:
        description: "What the key signs, for example release"
        required: true
        default: release
        type: string

permissions:
  contents: write

concurrency:
  group: release-key
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate
    runs-on: ubuntu-latest
    # Both App secrets live in this environment, and a job without
    # the binding reads neither one.
    environment: releng
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The token comes from the release engineering GitHub App. An
      # installation token lives an hour, so a leak expires, and no
      # expiry date can be missed.
      #
      # The call passes no repositories input. That input scopes a
      # token to the named repositories, and this workflow needs the
      # organization permissions of the installation for the two
      # secrets and the variable. The installation reaches Tooling
      # alone in any case, so the unscoped token grants nothing more.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELENG_APP_ID }}
          private-key: ${{ secrets.RELENG_PRIVATE_KEY }}
          owner: FuguBSD

      # No run of this workflow has minted a token from the App
      # before the first one. A token with no organization permission
      # fails at the secret write, and that message names neither the
      # App nor the missing permission. The report therefore comes
      # first, and it never prints the token.
      - name: Report the permissions of the token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api /installation/repositories --jq \
            '"repositories: " + ([.repositories[].full_name] | join(", "))'
          gh api -i /installation/repositories 2>/dev/null \
            | grep -i '^x-accepted-github-permissions:' || true

      # make deps installs the tool environment and then the
      # runtime one. The tool environment holds signify, which signs
      # the manifest, and gitleaks, which this job does not run.
      - name: Install the dependencies
        run: make deps

      # The script reads the key directory through the Fugu modules,
      # so the site and the rotation share one implementation of the
      # name pattern and of the manifest.
      - name: Install the Fugu library
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpanminus
          sudo cpanm --notest \
            https://github.com/FuguBSD/Fugu/releases/latest/download/Fugu.tar.gz

      - name: Read the active slot
        id: slot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          slot=$(gh api /orgs/FuguBSD/actions/variables/SIGNIFY_RELEASE_SLOT \
            --jq .value 2>/dev/null || true)
          case "$slot" in
            A) echo "active=A" >> "$GITHUB_OUTPUT"
               echo "idle=B"   >> "$GITHUB_OUTPUT" ;;
            B) echo "active=B" >> "$GITHUB_OUTPUT"
               echo "idle=A"   >> "$GITHUB_OUTPUT" ;;
            *) echo "active="  >> "$GITHUB_OUTPUT"
               echo "idle=A"   >> "$GITHUB_OUTPUT" ;;
          esac

      # The secrets reach the step through the environment, and never
      # through the script text, so no value can become part of a
      # command. A slot that holds nothing writes an empty file, and
      # the first mint of a purpose needs no signer.
      #
      # Both slots are written. A mint signs with the active key,
      # which is the current one. A promote signs with the idle key,
      # which is the next one that this run makes current.
      - name: Write the working key files
        env:
          KEY_A: ${{ secrets.SIGNIFY_RELEASE_KEY_A }}
          KEY_B: ${{ secrets.SIGNIFY_RELEASE_KEY_B }}
          ACTIVE: ${{ steps.slot.outputs.active }}
          IDLE: ${{ steps.slot.outputs.idle }}
        run: |
          work=$(mktemp -d)
          echo "WORK=$work" >> "$GITHUB_ENV"
          umask 077
          chmod 700 "$work"
          # signify(1) refuses a key file with no final newline, so
          # a file that holds a key ends in one. A slot that holds
          # nothing must leave an empty file: the steps below read
          # the size of each file to tell a key from no key, and a
          # lone newline would read as a key.
          : > "$work/active.sec"
          : > "$work/idle.sec"

          case "$ACTIVE" in
            A) active="$KEY_A" ;;
            B) active="$KEY_B" ;;
            *) active="" ;;
          esac
          case "$IDLE" in
            A) idle="$KEY_A" ;;
            B) idle="$KEY_B" ;;
            *) idle="" ;;
          esac

          [ -n "$active" ] && printf '%s\n' "$active" > "$work/active.sec"
          [ -n "$idle" ] && printf '%s\n' "$idle" > "$work/idle.sec"
          true

      - name: Run the rotation step
        id: rotate
        env:
          STEP: ${{ inputs.step }}
          PURPOSE: ${{ inputs.purpose }}
          ACTIVE: ${{ steps.slot.outputs.active }}
        run: |
          if [ "$STEP" = mint ]; then
            if [ -s "$WORK/active.sec" ]; then
              signer="--signer $WORK/active.sec"
            else
              signer=""
            fi
            # --org writes the keys block when the description
            # holds none, so the first key of the site and the block
            # that describes it arrive in one commit.
            # shellcheck disable=SC2086
            scripts/rotate-key --step mint --purpose "$PURPOSE" \
              --secret "$WORK/new.sec" --org fugubsd $signer \
              >> "$GITHUB_OUTPUT"
          else
            # The promote signs with the key that it makes current,
            # which the mint step wrote into the idle slot.
            if [ ! -s "$WORK/idle.sec" ]; then
              echo "rotate: the idle slot holds no key to promote" >&2
              exit 1
            fi
            scripts/rotate-key --step promote --purpose "$PURPOSE" \
              --secret "$WORK/idle.sec" >> "$GITHUB_OUTPUT"
          fi

      # A mint stores the new private key in the idle slot, and it
      # leaves the variable alone. The current key stays current
      # until the promote step, so a consumer that holds the old copy
      # of deps/KEYS.txt can still verify a release.
      - name: Store the new private key
        if: inputs.step == 'mint'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IDLE: ${{ steps.slot.outputs.idle }}
        run: |
          gh secret set "SIGNIFY_RELEASE_KEY_$IDLE" \
            --org FuguBSD \
            --visibility selected \
            --repos Fugu,FuguVM,FuguWeb,FuguTTX \
            --body "$(cat "$WORK/new.sec")"

      # The first mint of a purpose finds no active slot, so it also
      # names the slot that it just wrote. Every later mint leaves
      # the variable for the promote step.
      - name: Name the active slot
        if: inputs.step == 'promote' || steps.slot.outputs.active == ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IDLE: ${{ steps.slot.outputs.idle }}
        run: |
          # The new key sits in the idle slot in both cases: the first
          # mint wrote it there, and a promote makes the key that a
          # mint wrote there current.
          gh variable set SIGNIFY_RELEASE_SLOT \
            --org FuguBSD \
            --visibility all \
            --body "$IDLE"

      - name: Remove the working directory
        if: always()
        run: rm -rf "$WORK"

      - name: Check the site
        run: |
          sudo apt-get install --yes mandoc lowdown
          sudo cpanm --notest \
            https://github.com/FuguBSD/FuguWeb/releases/latest/download/App-FuguWeb.tar.gz
          fuguweb build --out web/build
          fuguweb check --out web/build
          rm -rf web/build

      - name: Commit the key directory
        env:
          NAME: ${{ steps.rotate.outputs.name }}
          STEP: ${{ inputs.step }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add .fuguwebrc web/keys
          git commit -m "feat(keys): $STEP $NAME"
          git push origin HEAD:main

      # The digest is the trust anchor of the declaration, so it comes
      # from the file that this run published.
      - name: Declare the key in FuguBSD/Tooling
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NAME: ${{ steps.rotate.outputs.name }}
          STEM: ${{ steps.rotate.outputs.stem }}
          STEP: ${{ inputs.step }}
        run: |
          digest=$(sha256sum "web/keys/$NAME" | cut -d' ' -f1)
          url="https://www.fugubsd.org/keys/$NAME"
          line="$STEM $url $digest"

          gh repo clone FuguBSD/Tooling tooling -- --depth 1
          cd tooling
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "keys/$STEM-$STEP"

          keys=org/sync/deps/KEYS.txt
          if [ "$STEP" = mint ]; then
            # The line order is the trust order, so a next key goes
            # under the current one.
            printf '%s\n' "$line" >> "$keys"
          else
            # A promote makes the key current, so its line leads.
            grep -v "^$STEM " "$keys" > "$keys.tmp"
            awk -v line="$line" '
              !done && (/^#/ || /^[ \t]*$/) { print; next }
              !done { print line; print; done = 1; next }
              { print }
              END { if (!done) print line }
            ' "$keys.tmp" > "$keys"
            rm -f "$keys.tmp"
          fi

          git add "$keys"
          git commit -m "feat(deps): declare the release key $STEM"
          git push -u origin "keys/$STEM-$STEP"
          gh pr create \
            --title "feat(deps): declare the release key $STEM" \
            --body "The rotation workflow of FuguBSD/Website published
          \`$url\` and recorded its digest here.

          Merge this only after the URL serves the key. \`scripts/deps\`
          fetches each declared URL, so a line whose URL answers 404
          breaks \`make deps\` in every consumer that has synced.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
